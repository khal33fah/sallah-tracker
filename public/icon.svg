<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e17" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Geometric Prayer Frame -->
  <rect x="56" y="56" width="400" height="400" rx="32" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.4" />
  <rect x="70" y="70" width="372" height="372" rx="24" fill="none" stroke="url(#emeraldGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8,6" />

  <!-- Prayer Mat / Mihrab Arch Silhouette -->
  <!-- Inner Mihrab arch shape -->
  <path d="M156 400 V 230 C 156 160, 206 120, 256 94 C 306 120, 356 160, 356 230 V 400 Z"
        fill="#06201b" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Arch Inner Ornamental Border -->
  <path d="M174 388 V 236 C 174 180, 214 146, 256 122 C 298 146, 338 180, 338 236 V 388 Z"
        fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Crescent & Star at Apex of Mihrab -->
  <path d="M260 178 A 24 24 0 1 1 242 144 A 20 20 0 0 0 258 178 Z" fill="url(#goldGrad)" />
  <!-- Mini 5-pointed star -->
  <polygon points="266,150 268,155 273,155 269,158 271,163 266,160 262,163 264,158 260,155 265,155" fill="url(#goldGrad)" />

  <!-- Prayer Rug Center Medallion (Kaaba / Geometric Symbol) -->
  <g transform="translate(256, 280)">
    <!-- Rotating diamond pattern -->
    <rect x="-38" y="-38" width="76" height="76" rx="10" transform="rotate(45)" fill="#0f3d32" stroke="url(#goldGrad)" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="url(#emeraldGrad)" />
    <circle cx="0" cy="0" r="6" fill="#fef08a" />
    
    <!-- Radiating geometric crosslines -->
    <line x1="-32" y1="0" x2="-20" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="20" y1="0" x2="32" y2="0" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="0" y1="-32" x2="0" y2="-20" stroke="url(#goldGrad)" stroke-width="2" />
    <line x1="0" y1="20" x2="0" y2="32" stroke="url(#goldGrad)" stroke-width="2" />
  </g>

  <!-- Lower Prayer Mat Fringe Tassels -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="168" y1="400" x2="168" y2="420" />
    <line x1="188" y1="400" x2="188" y2="420" />
    <line x1="208" y1="400" x2="208" y2="420" />
    <line x1="228" y1="400" x2="228" y2="420" />
    <line x1="248" y1="400" x2="248" y2="420" />
    <line x1="268" y1="400" x2="268" y2="420" />
    <line x1="288" y1="400" x2="288" y2="420" />
    <line x1="308" y1="400" x2="308" y2="420" />
    <line x1="328" y1="400" x2="328" y2="420" />
    <line x1="344" y1="400" x2="344" y2="420" />
  </g>

  <!-- Camera Scan Reticle Corner Accents (symbolizing phone camera verification) -->
  <g stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Top-Left -->
    <path d="M120 148 H 100 V 168" />
    <!-- Top-Right -->
    <path d="M392 148 H 412 V 168" />
    <!-- Bottom-Left -->
    <path d="M100 344 V 364 H 120" />
    <!-- Bottom-Right -->
    <path d="M412 344 V 364 H 392" />
  </g>
</svg>
